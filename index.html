<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>dTECT Training Guides</title>
<style>
:root { --bg: #f4f7f9; --card: #ffffff; --ink: #15212c; --muted: #546474; --line: #cfd9e2; --brand: #1b5e85; --on-brand: #ffffff; --err: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f161d; --card: #17212b; --ink: #e6edf3; --muted: #9aabbb; --line: #2c3a47; --brand: #7cc0e6; --on-brand: #0f161d; --err: #ff8a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Roboto", "Segoe UI", system-ui, sans-serif;
  display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 28px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 22px; }
p { margin: 0; color: var(--muted); font-size: 14.5px; }
label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
button { font: 600 15px/1 "Roboto", "Segoe UI", system-ui, sans-serif; padding: 12px; border: 0; border-radius: 8px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
#err { color: var(--err); min-height: 1.5em; }
body.trying form { visibility: hidden; }
a { color: var(--brand); font-size: 14.5px; }
</style>
</head>

</form>

const KEPT = "dtect-guide-pw";
const b64 = s => fetch("data:application/octet-stream;base64," + s).then(r => r.arrayBuffer());
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: await b64(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: await b64(P.iv) }, key, await b64(P.ct));
  const view = new DataView(plain);
  const hlen = view.getUint32(0);
  const head = JSON.parse(new TextDecoder().decode(new Uint8Array(plain, 4, hlen)));
  let html = head.html;
  const start = 4 + hlen;
  for (const m of head.media) {
    const url = URL.createObjectURL(new Blob([new Uint8Array(plain, start + m.offset, m.size)], { type: m.type }));
    html = html.split(m.path).join(url);
  }
  try { localStorage.setItem(KEPT, pw); } catch (x) { /* storage blocked: ask again next time */ }
  document.open();
  document.write(html);
  document.close();
}
(async () => {
  let kept = null;
  try { kept = localStorage.getItem(KEPT); } catch (x) { /* storage blocked */ }
  if (kept) {
    try { await unlock(kept); return; }
    catch (x) { try { localStorage.removeItem(KEPT); } catch (y) { /* storage blocked */ } }
  }
  document.body.classList.remove("trying");
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Opening..."; err.textContent = "";
  try {
    await unlock(document.getElementById("pw").value);
  } catch (x) {
    err.textContent = "That password is not right. Check it and try again.";
    go.disabled = false; go.textContent = "Open";
  }
});
</script>
